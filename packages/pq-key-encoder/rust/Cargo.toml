[package]
name = "pq-key-encoder"
version = "0.0.1"
edition = "2021"
description = "Post-quantum key encoding (DER, PEM, JWK) for ML-KEM, ML-DSA, SLH-DSA"
license = "MIT"
readme = "README.md"
keywords = ["post-quantum", "cryptography", "key-encoding", "pqc", "der"]
categories = ["cryptography", "encoding"]

[features]
default = ["std", "pem"]
std = ["pq-oid/std"]
pem = []
jwk = []

[dependencies]
pq-oid = { path = "../../pq-oid/rust" }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
